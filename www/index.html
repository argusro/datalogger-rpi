<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">Raspberry Pi Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 24px auto;
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            font-size: 1.5em;
        }
        .info {
            margin: 12px 0;
            font-size: 1em;
        }
        .label {
            font-weight: bold;
        }
        #restartBtn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #d9534f;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 32px;
        }
        #restartBtn:hover {
            background: #c9302c;
        }
        #hostname {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }
        th, td {
            padding: 8px 4px;
            text-align: left;
        }
        th {
            background: #f4f4f4;
        }
        tr {
            border-bottom: 1px solid #eee;
        }
        button {
            padding: 8px 12px;
            font-size: 1em;
            border-radius: 4px;
            border: none;
            background: #337ab7;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background: #23527c;
        }
        @media (max-width: 500px) {
            .container {
                max-width: 98vw;
                padding: 8px;
            }
            h2 {
                font-size: 1.2em;
            }
            table, th, td {
                font-size: 0.9em;
            }
            button, #restartBtn {
                font-size: 0.95em;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
    <h2 id="hostTitle">Raspberry Pi Status</h2>
    <div class="info" style="display:none;"><span class="label">Hostname:</span> <span id="hostname">...</span></div>
        <div class="info"><span class="label">IP LAN:</span> <span id="ip">...</span></div>
    <div class="info"><span class="label">IP WAN:</span> <span id="external_ip">...</span></div>
        <div class="info"><span class="label">Current Time:</span> <span id="time">...</span></div>
        <div class="info"><span class="label">Uptime:</span> <span id="uptime">...</span></div>
        <h3>Service Monitor</h3>
        <table style="width:100%;margin-top:16px;text-align:left;">
            <thead>
                <tr><th>Service</th><th>Status</th><th>PID</th><th>Action</th></tr>
            </thead>
            <tbody id="servicesTable"></tbody>
        </table>
        <button id="restartBtn">Restart</button>
    </div>
    <script>
    function fetchStatus() {
        fetch(`http://${window.location.hostname}:5000/api/status`)
            .then(r => r.json())
            .then(data => {
                document.getElementById('hostname').textContent = data.hostname;
                document.getElementById('ip').textContent = data.ip || 'N/A';
                document.getElementById('external_ip').textContent = data.external_ip || 'N/A';
                document.getElementById('time').textContent = data.time;
                document.getElementById('uptime').textContent = data.uptime;
                document.getElementById('hostTitle').textContent = data.hostname;
                document.title = data.hostname;
            });
    }

    function fetchServices() {
        fetch(`http://${window.location.hostname}:5000/api/services`)
            .then(r => r.json())
            .then(data => {
                const table = document.getElementById('servicesTable');
                table.innerHTML = '';
                data.services.forEach(svc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${svc.name}</td>
                        <td>${svc.status}</td>
                        <td>${svc.pid || ''}</td>
                        <td><button onclick="restartService('${svc.name}')">Restart</button></td>
                    `;
                    table.appendChild(tr);
                });
            });
    }

    function restartService(service) {
        if (confirm(`Restart ${service}?`)) {
            fetch(`http://${window.location.hostname}:5000/api/restart_service`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({service})
            })
            .then(r => r.json())
            .then(data => {
                alert(`Restarted ${service}`);
                fetchServices();
            });
        }
    }

    fetchStatus();
    fetchServices();
    setInterval(fetchStatus, 5000);
    setInterval(fetchServices, 5000);

    document.getElementById('restartBtn').onclick = function() {
        if (confirm('Are you sure you want to restart the Raspberry Pi?')) {
            fetch(`http://${window.location.hostname}:5000/api/restart`, {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    alert('Restarting...');
                });
        }
    };
    </script>
</body>
</html>
